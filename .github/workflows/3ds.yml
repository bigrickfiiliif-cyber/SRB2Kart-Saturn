name: Nintendo 3DS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-3ds:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build 3dsx
        run: make -C 3ds -j$(nproc)
      - uses: actions/upload-artifact@v4
        with:
          name: srb2kart-saturn-3ds
          path: |
            3ds/srb2kart-saturn.3dsx
            3ds/README.md
